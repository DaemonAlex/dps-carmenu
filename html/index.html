<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DPS Fleet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel" class="panel" hidden>
  <header class="bar">
    <div class="logo">DPS FLEET</div>
    <div class="searchwrap">
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search name, brand, model, pack…  tokens: cat: pack: type: brand: price:&lt;50000 speed:&gt;200 sort:price-desc">
      <span id="count" class="count">0 of 0</span>
    </div>
    <div class="views">
      <button class="tab on" data-view="all">All</button>
      <button class="tab" data-view="recent">Recent</button>
      <button class="tab" data-view="fav">★ Favorites</button>
    </div>
    <button id="close" class="icon" title="Close (Esc)">✕</button>
  </header>

  <div class="grid">
    <nav id="rail" class="rail"></nav>

    <section class="list" id="listwrap">
      <div class="listhead"><span>Vehicle</span><span>model · category · price</span></div>
      <div id="list" class="rows"></div>
    </section>

    <aside class="detail" id="detail">
      <div class="empty" id="empty">Pick a vehicle. <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> spawns in place · <kbd>Shift</kbd>+<kbd>Enter</kbd> spawns beside · <kbd>C</kbd> copies the card</div>
      <div id="card" hidden>
        <h3 id="d-name"></h3>
        <div class="meta" id="d-meta"></div>
        <div class="kv" id="d-kv"></div>
        <div class="handling" id="d-handling"></div>
        <div class="btns">
          <button id="b-spawn" class="btn p">Spawn · Enter</button>
          <button id="b-beside" class="btn">Spawn beside</button>
          <button id="b-card" class="btn s">Copy card</button>
          <button id="b-handling" class="btn s">Copy handling</button>
          <button id="b-fav" class="btn">☆ Favorite</button>
          <button id="b-delete" class="btn d">Remove mine</button>
        </div>
      </div>
    </aside>
  </div>

  <footer class="foot"><span id="hint">F7 or /carmenu · admins and testers · reads the live registry</span></footer>
  <div id="toast" class="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
